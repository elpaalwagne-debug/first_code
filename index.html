<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>For Lila 💖 A Thousand Years</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card" id="card">
    <h1>✨ For Lila ✨</h1>
    <div class="question" id="questionText">Lila... I made something just for you 💌</div>
    <div>
        <button id="revealBtn">💖 Open for you 💖</button>
        <button id="resetBtn" style="background:#b28a9c; display:none;">🔄 Start over</button>
    </div>
    <div class="message-box" id="messageBox">
        <div class="typing" id="typingMessage"></div>
        <div class="signature" id="signature"></div>
    </div>
    <div class="jokes-box" id="jokesBox">
        <div style="font-weight: bold; margin-bottom: 10px;">😊 A little smile for Lila:</div>
        <div class="joke-text" id="jokeDisplay"></div>
        <button id="nextJokeBtn" style="background:#c9a9b8; font-size:1rem;">👉 Another one 👈</button>
    </div>
    <div class="music-control" id="musicStatus">🎵 "A Thousand Years" (Piano) will play when you open 💖</div>
    <footer>made with ❤️ + code + jokes for Lila</footer>
</div>

<!-- Audio element with reliable piano cover of "A Thousand Years" -->
<audio id="bgMusic" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/02/22/audio_d0e2b2d6c6.mp3?filename=a-thousand-years-piano-cover-102230.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
