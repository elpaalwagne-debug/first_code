<body>

  <!-- Background Music -->
  <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <h1>I’m Sorry, <span id="name"></span> 💖</h1>

    <p>
      I may not have the perfect words,  
      and I may not be perfect either…  
      but I truly care and I never meant to hurt you.
      <br><br>
      Can we be friends like the past days? 🌸
    </p>

    <h3>Will you forgive me? 🥺</h3>

    <div class="buttons">
      <button class="yes" onclick="forgiven()">Yes 💕</button>
      <button class="no" id="noBtn">No 🙃</button>
    </div>

    <p id="response"></p>
  </div>

  <script src="script.js"></script>
</body>
